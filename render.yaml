# ==============================================================================
# REWOIX: The Corporate Experience Simulator
# Render Infrastructure Blueprint (render.yaml) - 100% Free Tier Compatible
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

version: "1"

databases:
  - name: rewoix-db
    databaseName: rewoix
    user: rewoix_admin
    plan: free
    ipAllowList: [] # Allows internal services within Render network

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Engine (Free Plan)
  # ----------------------------------------------------------------------------
  - type: web
    name: rewoix-backend
    runtime: docker
    dockerfilePath: Dockerfile.backend
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: "REWOIX Experience Platform"
      - key: DATABASE_URL
        fromDatabase:
          name: rewoix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_PROVIDER
        value: local
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: DEFAULT_PLATFORM_COMMISSION_PERCENT
        value: "30.0"
      - key: DEFAULT_TEACHER_SHARE_PERCENT
        value: "70.0"
      - key: DEFAULT_CURRENCY
        value: "INR"

  # ----------------------------------------------------------------------------
  # 2. Next.js 14 Interactive Web Frontend (Free Plan)
  # ----------------------------------------------------------------------------
  - type: web
    name: rewoix-frontend
    runtime: docker
    dockerfilePath: Dockerfile.frontend
    dockerContext: .
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: rewoix-backend
          property: host
