version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Relational Database: PostgreSQL 15
  # -------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: rewoix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-rewoix_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rewoix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rewoix_network

  # -------------------------------------------------------------
  # 2. In-Memory Cache & Job Broker: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rewoix_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rewoix_network

  # -------------------------------------------------------------
  # 3. Enterprise Backend API: FastAPI (Python 3.11)
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rewoix_backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-super_secret_rewoix_production_key_12345}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rewoix_db}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-rewoix_db}
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-rzp_test_secret_placeholder}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_DIR=/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rewoix_network

  # -------------------------------------------------------------
  # 4. Web Application Frontend: Next.js 14 App Router
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: rewoix_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - INTERNAL_API_URL=http://backend:8000/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - rewoix_network

# -------------------------------------------------------------
# Persistent Volumes & Custom Isolated Network
# -------------------------------------------------------------
volumes:
  postgres_data:
    name: rewoix_postgres_data
  redis_data:
    name: rewoix_redis_data
  media_data:
    name: rewoix_media_data

networks:
  rewoix_network:
    name: rewoix_network
    driver: bridge
